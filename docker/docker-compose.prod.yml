services:
  # --- Nginx 反向代理 ---
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ${SSL_CERT_DIR:-./nginx/ssl}:/etc/nginx/ssl:ro
      - frontend_static:/usr/share/nginx/html:ro
    environment:
      - SERVER_NAME=${SERVER_NAME:-_}
      - HTTP_PORT=${HTTP_PORT:-80}
      - HTTPS_PORT=${HTTPS_PORT:-443}
      - ENABLE_HTTPS=${ENABLE_HTTPS:-false}
    command: /entrypoint.sh
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${HTTP_PORT:-80}/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    restart: always

  # --- 应用服务 ---
  api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-onceme/instantboard}-api:${IMAGE_TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file:
      - ../.env
    environment:
      - ENV=production
      - DATABASE_URL=${PROD_DATABASE_URL:-postgresql+asyncpg://instantboard:prodpass123@postgres:5432/instantboard}
      - REDIS_URL=${PROD_REDIS_URL:-redis://:prodredis123@redis:6379/0}
      - SECRET_KEY=${PROD_SECRET_KEY:-change-this-prod-secret-key-at-least-32-chars}
    ports: []
    command: >-
      gunicorn app.main:app
      --bind 0.0.0.0:8000
      --workers 1
      --worker-class uvicorn.workers.UvicornWorker
      --timeout 120
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ../backend/seed_data.py:/app/seed_data.py:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    restart: always

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-onceme/instantboard}-api:${IMAGE_TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file:
      - ../.env
    environment:
      - ENV=production
      - DATABASE_URL=${PROD_DATABASE_URL:-postgresql+asyncpg://instantboard:prodpass123@postgres:5432/instantboard}
      - REDIS_URL=${PROD_REDIS_URL:-redis://:prodredis123@redis:6379/0}
      - SECRET_KEY=${PROD_SECRET_KEY:-change-this-prod-secret-key-at-least-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.scheduler.worker
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'scheduler.worker' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    restart: always

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-onceme/instantboard}-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: prod
    command: ["/entrypoint.sh"]
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - frontend_static:/usr/share/nginx/html
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: always

  # --- 基础服务 ---
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${PROD_POSTGRES_DB:-instantboard}
      POSTGRES_USER: ${PROD_POSTGRES_USER:-instantboard}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:-prodpass123}
    ports: []
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_POSTGRES_USER:-instantboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M
    restart: always

  redis:
    image: redis:7-alpine
    ports: []
    volumes:
      - redis_prod_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${PROD_REDIS_PASSWORD:-prodredis123}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PROD_REDIS_PASSWORD:-prodredis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    restart: always

  mongodb:
    image: mongo:6
    ports: []
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PROD_MONGO_USER:-instantboard}
      MONGO_INITDB_ROOT_PASSWORD: ${PROD_MONGO_PASSWORD:-prodmongo123}
    volumes:
      - mongodb_prod_data:/data/db
    profiles:
      - mongodb
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: always

volumes:
  postgres_prod_data:
  redis_prod_data:
  mongodb_prod_data:
  frontend_static:
