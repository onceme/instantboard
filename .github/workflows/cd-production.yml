name: Deploy Production

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/instantboard

jobs:
  build-and-push:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_PREFIX }}-api:production-latest
            ghcr.io/${{ env.IMAGE_PREFIX }}-api:production-${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.release_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_PREFIX }}-frontend:production-latest
            ghcr.io/${{ env.IMAGE_PREFIX }}-frontend:production-${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.release_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create deployment env file
        run: |
          cat > /tmp/.env.production << 'EOF'
          ENV=production
          DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL=${{ secrets.PROD_REDIS_URL }}
          SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          CORS_ORIGINS=${{ secrets.PROD_CORS_ORIGINS }}
          EOF

      - name: Deploy via SSH (backend first)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/instantboard
            # Auto-detect Docker Compose (V2 plugin) or docker-compose (V1 standalone)
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            # Pull latest images
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml pull api worker
            # Rolling deploy: backend first
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d --no-deps api worker
            # Wait for backend health check
            echo "Waiting for API health check..."
            for i in $(seq 1 30); do
              if curl -sf http://api:8000/api/v1/health; then
                echo "API is healthy"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

      - name: Deploy frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/instantboard
            # Auto-detect Docker Compose (V2 plugin) or docker-compose (V1 standalone)
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            # Pull and deploy frontend + nginx
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml pull frontend nginx
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d --no-deps frontend nginx

      - name: Health check
        run: |
          sleep 10
          HEALTH_STATUS=$(curl -sf https://${{ secrets.PROD_DOMAIN }}/api/v1/health || echo "FAILED")
          if [ "$HEALTH_STATUS" = "FAILED" ]; then
            echo "Production health check FAILED!"
            exit 1
          fi
          echo "Production deployment successful!"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/instantboard
            # Auto-detect Docker Compose (V2 plugin) or docker-compose (V1 standalone)
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            # Rollback to previous known-good images
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml down
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
            echo "Rollback attempted"
