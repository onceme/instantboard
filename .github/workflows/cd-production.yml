name: Deploy Production

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/instantboard

jobs:
  build-and-push:
    name: Build or Promote Production Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # HEAD^2 requires full history; the default fetch-depth=1 cannot resolve parent commits

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Decide promote or fallback build
        id: decide
        run: |
          # Promote semantics (build-once): staging merges into main as merge commit M,
          # whose second parent M^2 is the staging tip S that staging already deployed
          # as staging-<short(S)>. When both staging images exist in GHCR, retag them to
          # production (registry-side manifest rewrite only — no layers are copied, takes
          # seconds). Otherwise (hotfix/squash/re-cut release, or images cleaned up) fall
          # back to a full multi-arch build exactly as before.
          # See docs/design/cd-workflow-optimization.md §4.2.
          set -euo pipefail
          STAGING_SHA="$(git rev-parse --verify --quiet HEAD^2 || true)"
          if [ -z "$STAGING_SHA" ]; then
            echo "::warning::release commit is not a merge commit (no second parent) — falling back to full build"
            echo "mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHORT="$(git rev-parse --short "$STAGING_SHA")"
          API="ghcr.io/${{ env.IMAGE_PREFIX }}-api:staging-$SHORT"
          FE="ghcr.io/${{ env.IMAGE_PREFIX }}-frontend:staging-$SHORT"
          if docker buildx imagetools inspect "$API" >/dev/null 2>&1 \
             && docker buildx imagetools inspect "$FE" >/dev/null 2>&1; then
            echo "::notice::promoting staging images (S=$SHORT)"
            echo "mode=promote" >> "$GITHUB_OUTPUT"
            echo "staging_short=$SHORT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::staging-$SHORT images not found in GHCR (never deployed / cleaned up) — falling back to full build"
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote staging images (retag, no rebuild)
        if: steps.decide.outputs.mode == 'promote'
        run: |
          set -euo pipefail
          SHORT="${{ steps.decide.outputs.staging_short }}"
          for name in api frontend; do
            docker buildx imagetools create \
              --tag "ghcr.io/${{ env.IMAGE_PREFIX }}-$name:production-latest" \
              --tag "ghcr.io/${{ env.IMAGE_PREFIX }}-$name:production-${{ steps.meta.outputs.sha_short }}" \
              --tag "ghcr.io/${{ env.IMAGE_PREFIX }}-$name:${{ steps.meta.outputs.release_tag }}" \
              "ghcr.io/${{ env.IMAGE_PREFIX }}-$name:staging-$SHORT"
          done

      - name: Set up QEMU
        if: steps.decide.outputs.mode == 'build'
        uses: docker/setup-qemu-action@v3

      - name: Build and push backend image (fallback)
        if: steps.decide.outputs.mode == 'build'
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_PREFIX }}-api:production-latest
            ghcr.io/${{ env.IMAGE_PREFIX }}-api:production-${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.release_tag }}
          cache-from: |
            type=gha,scope=production-backend
            type=gha,scope=staging-backend
          cache-to: type=gha,scope=production-backend,mode=max

      - name: Build and push frontend image (fallback)
        if: steps.decide.outputs.mode == 'build'
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_PREFIX }}-frontend:production-latest
            ghcr.io/${{ env.IMAGE_PREFIX }}-frontend:production-${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.release_tag }}
          cache-from: |
            type=gha,scope=production-frontend
            type=gha,scope=staging-frontend
          cache-to: type=gha,scope=production-frontend,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create deployment env file
        run: |
          cat > /tmp/.env.production << 'EOF'
          ENV=production
          DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL=${{ secrets.PROD_REDIS_URL }}
          SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          CORS_ORIGINS=${{ secrets.PROD_CORS_ORIGINS }}
          EOF

      - name: Deploy via SSH (backend first)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            export IMAGE_REGISTRY="${{ env.REGISTRY }}"
            export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
            export IMAGE_TAG="production-latest"
            cd /opt/instantboard
            # TODO(cd-parity): same drift risk staging had — the working tree is
            # NOT synced to the commit being deployed (no git fetch/checkout),
            # so compose/config files on the host can lag behind the images.
            # Mirror the `git fetch origin && git checkout <sha>` step from
            # cd-staging.yml once /opt/instantboard on the production host is
            # confirmed to be a clean git checkout of this repo. Applies to the
            # frontend and rollback SSH steps below as well. Deliberately not
            # changed in this pass.
            # Auto-detect Docker Compose (V2 plugin) or docker-compose (V1 standalone)
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            # Pull latest images
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env pull api worker
            # Rolling deploy: backend first
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env up -d --no-deps api worker
            # Wait for the REAL health signal: the api container's built-in
            # docker healthcheck (curl http://localhost:8000/api/v1/health run
            # inside the container, defined in docker-compose.prod.yml).
            # The old loop curled http://api:8000 from the HOST, where the
            # container hostname "api" does not resolve, and it exited 0 even
            # after 30 failures — dead code that gated nothing. Now a timeout
            # fails the step (and triggers the rollback job).
            echo "Waiting for API health check..."
            HEALTHY=0
            for i in $(seq 1 45); do
              if $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env ps api | grep -q "(healthy)"; then
                echo "API is healthy"
                HEALTHY=1
                break
              fi
              echo "Waiting... ($i/45)"
              sleep 2
            done
            if [ "$HEALTHY" -ne 1 ]; then
              echo "API did not become healthy in time — dumping logs"
              $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env logs --tail=100 api worker
              exit 1
            fi

      - name: Deploy frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            export IMAGE_REGISTRY="${{ env.REGISTRY }}"
            export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
            export IMAGE_TAG="production-latest"
            cd /opt/instantboard
            # Auto-detect Docker Compose (V2 plugin) or docker-compose (V1 standalone)
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            # Pull and deploy frontend + nginx
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env pull frontend nginx
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env up -d --no-deps frontend nginx

      - name: Health check
        run: |
          # Production is expected to serve HTTPS on the standard port. If the
          # production port mapping or TLS setup ever changes, update the URLs
          # below accordingly (see the staging smoke test for the HTTP variant).
          BASE_URL="https://${{ secrets.PROD_DOMAIN }}"
          echo "Health checking ${BASE_URL}"
          sleep 10
          # Retry a few times so slow container startup does not fail the
          # deploy, but a truly broken one does.
          health_check() {
            local url="$1"
            for attempt in 1 2 3 4 5 6; do
              if curl -sf --max-time 10 "$url" > /dev/null; then
                echo "OK: ${url}"
                return 0
              fi
              echo "Attempt ${attempt}/6 failed for ${url}"
              sleep 5
            done
            echo "FAILED: ${url} not reachable after 6 attempts"
            return 1
          }
          FAILED=0
          health_check "${BASE_URL}/api/v1/health" || FAILED=1
          health_check "${BASE_URL}/" || FAILED=1
          if [ "$FAILED" -ne 0 ]; then
            echo "Production health check FAILED!"
            exit 1
          fi
          echo "Production deployment successful!"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            export IMAGE_REGISTRY="${{ env.REGISTRY }}"
            export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
            # The old "rollback" re-exported IMAGE_TAG="production-latest" — the
            # very image that just failed — so it re-deployed the broken build
            # and rolled back nothing. There is no persisted "last known good"
            # production tag on the host yet, so we fall back to staging-latest:
            # the most recent image soak-tested in the staging environment.
            # Limitations (known, deliberate — do not over-engineer here):
            #   1. If the failed release was cut from current staging HEAD,
            #      staging-latest may contain the same broken commit.
            #   2. Database migrations applied by the failed release are NOT
            #      reverted by this rollback.
            # A proper fix is a last-known-good marker (e.g. write the release
            # tag to a file on the host only after a successful health check,
            # and roll back to that tag here).
            export IMAGE_TAG="staging-latest"
            cd /opt/instantboard
            # Auto-detect Docker Compose (V2 plugin) or docker-compose (V1 standalone)
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            # Pull the fallback images first, then restart the stack on them
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env pull
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env down
            $DC -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env up -d
            echo "Rollback attempted (to staging-latest)"
