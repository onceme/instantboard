services:
  # --- Infrastructure services ---
  postgres:
    # PostgreSQL 17, Debian-based image on purpose (NOT alpine): staging's data
    # directory was initialized by a Debian-based PostgreSQL 17.7 image and is
    # reused as-is (no in-place downgrade possible). The alpine variant uses
    # musl instead of glibc, whose collation differences can silently change
    # string ordering and invalidate existing string indexes. Same major
    # version + same libc family keeps the existing data directory compatible.
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instantboard_dev}
      POSTGRES_USER: ${POSTGRES_USER:-instantboard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
    # Host port publication lives in docker-compose.override.yml (dev only),
    # so base+prod merges never expose the database on the host.
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-instantboard}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Host port publication lives in docker-compose.override.yml (dev only).
    volumes:
      - redis_dev_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:6
    # Host port publication lives in docker-compose.override.yml (dev only).
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-instantboard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-devpass}
    volumes:
      - mongodb_dev_data:/data/db
    profiles:
      - mongodb
    restart: unless-stopped

  # --- Application services ---
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-instantboard}:${DB_PASSWORD:-devpass}@postgres:5432/${POSTGRES_DB:-instantboard_dev}
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://${MONGO_USER:-instantboard}:${MONGO_PASSWORD:-devpass}@mongodb:27017/instantboard_dev
      - ENV=development
    # Host port publication and dev bind mounts (live host-code reload) live
    # in docker-compose.override.yml, so prod merges run the image's own code
    # with no host ports exposed.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      - VITE_API_URL=http://localhost:${API_PORT:-8000}
      - VITE_SSE_URL=http://localhost:${API_PORT:-8000}
      - VITE_PROXY_TARGET=http://api:8000
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 3000
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:
  mongodb_dev_data:
