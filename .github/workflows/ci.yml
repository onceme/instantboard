name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -e .

      - name: Ruff lint
        run: cd backend && ruff check app/

      - name: Ruff format check
        # tests/ included: depends on batch 2-C formatting landing. The
        # current working tree is verified clean (ruff format --check
        # app/ tests/ exits 0), but the committed tree still has 32
        # unformatted tests/ files — this change MUST be committed together
        # with (or after) the batch 2-C reformat, or this gate stays red.
        run: cd backend && ruff format --check app/ tests/

      - name: MyPy type check
        # SOFT GATE (kept on purpose): mypy currently reports ~425 errors in 48
        # files, so failing the pipeline today would only block unrelated work.
        # Track the cleanup separately: fix per-module, then remove "|| true"
        # to make this a hard gate (do not add new errors in the meantime).
        run: cd backend && mypy app/ --ignore-missing-imports || true

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Hard gates: verified passing on the current tree
      # (eslint . --max-warnings=0, prettier --check ., npm run type-check).
      - name: ESLint
        run: cd frontend && npx eslint . --max-warnings=0

      - name: Prettier check
        run: cd frontend && npx prettier --check .

      - name: TypeScript type check
        run: cd frontend && npm run type-check

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        # Keep in sync with the dev/prod stacks: postgres:17 (Debian-based,
        # not alpine) so CI behaves like staging, which runs a Debian-based
        # PostgreSQL 17.7.
        image: postgres:17
        env:
          POSTGRES_DB: instantboard_test
          POSTGRES_USER: instantboard
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -e .

      - name: Run backend tests
        env:
          ENV: test
          DATABASE_URL: postgresql+asyncpg://instantboard:testpass@localhost:5432/instantboard_test
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET: test-jwt-secret-for-ci
          SCHEDULER_ENABLED: false
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Hard gate: verified passing (vitest run, all tests green).
      - name: Run frontend tests
        run: cd frontend && npm run test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Verify build output
        run: ls -la frontend/dist/

  build-docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
