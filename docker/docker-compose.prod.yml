services:
  # --- Nginx 反向代理 ---
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    restart: always

  # --- 应用服务 ---
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file:
      - ../.env
    environment:
      - ENV=production
      - DATABASE_URL=${PROD_DATABASE_URL:-postgresql+asyncpg://instantboard:prodpass123@postgres:5432/instantboard}
      - REDIS_URL=${PROD_REDIS_URL:-redis://:prodredis123@redis:6379/0}
      - SECRET_KEY=${PROD_SECRET_KEY:-change-this-prod-secret-key-at-least-32-chars}
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: always

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    env_file:
      - ../.env
    environment:
      - ENV=production
      - DATABASE_URL=${PROD_DATABASE_URL:-postgresql+asyncpg://instantboard:prodpass123@postgres:5432/instantboard}
      - REDIS_URL=${PROD_REDIS_URL:-redis://:prodredis123@redis:6379/0}
      - SECRET_KEY=${PROD_SECRET_KEY:-change-this-prod-secret-key-at-least-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.scheduler.worker
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'scheduler.worker' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: prod
    command: nginx -g "daemon off;"
    volumes:
      - frontend_static:/usr/share/nginx/html
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: always

  # --- 基础服务 ---
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${PROD_POSTGRES_DB:-instantboard}
      POSTGRES_USER: ${PROD_POSTGRES_USER:-instantboard}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:-prodpass123}
    ports: []
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_POSTGRES_USER:-instantboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: always

  redis:
    image: redis:7-alpine
    ports: []
    volumes:
      - redis_prod_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly yes --requirepass ${PROD_REDIS_PASSWORD:-prodredis123}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PROD_REDIS_PASSWORD:-prodredis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: always

  mongodb:
    image: mongo:6
    ports: []
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PROD_MONGO_USER:-instantboard}
      MONGO_INITDB_ROOT_PASSWORD: ${PROD_MONGO_PASSWORD:-prodmongo123}
    volumes:
      - mongodb_prod_data:/data/db
    profiles:
      - mongodb
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: always

volumes:
  postgres_prod_data:
  redis_prod_data:
  mongodb_prod_data:
  frontend_static:
