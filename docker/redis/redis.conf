# InstantBoard Redis configuration
# Used in both development and production environments

bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# Persistence
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
