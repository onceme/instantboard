services:
  postgres-test:
    # Keep in sync with the dev/prod stacks: postgres:17 (Debian-based, not
    # alpine) so CI/local test runs behave like staging, which runs a
    # Debian-based PostgreSQL 17.7.
    image: postgres:17
    environment:
      POSTGRES_DB: instantboard_test
      POSTGRES_USER: instantboard
      POSTGRES_PASSWORD: testpass
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instantboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-test:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    environment:
      - ENV=test
      - DATABASE_URL=postgresql+asyncpg://instantboard:testpass@postgres-test:5432/instantboard_test
      - REDIS_URL=redis://redis-test:6379/1
      - SECRET_KEY=test-secret-key
      - JWT_SECRET=test-jwt-secret
      - SCHEDULER_ENABLED=false
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: >
      sh -c "
        python -m pytest tests/ -v --cov=app --cov-report=html
      "
    profiles:
      - test
