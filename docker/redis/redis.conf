# InstantBoard Redis configuration
# Used in both development and production environments

bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# Persistence - RDB snapshots (sufficient for low-resource deployment like Raspberry Pi 2)
save 900 1
save 300 10
save 60 10000

# Disable AOF by default to reduce disk I/O and memory usage on low-resource devices.
# RDB snapshots above provide adequate persistence. Enable AOF only if stronger durability is needed.
appendonly no

# Logging
loglevel notice

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
