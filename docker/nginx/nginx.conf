worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # --- Rate limiting (L1, coarse per-IP abuse protection) ---
    # Division of labor with the application layer: nginx limits only the RAW
    # request rate per client IP so floods cannot saturate the proxy/upstream
    # or exhaust backend resources (anti-abuse / anti-overrun, no external
    # state, works even when Redis is down); the FastAPI RateLimitMiddleware
    # (L2, Redis sliding window) does the fine-grained governance on top —
    # per tenant + IP + route class with per-minute thresholds (see
    # docs/dev-guide/design/security.md §3.3). L1 deliberately sits OUTSIDE
    # the app: rejecting requests here costs ~zero backend work.
    #
    # Key is $binary_remote_addr: correct for the single-proxy deployment
    # where nginx observes the true client. Behind an additional upstream
    # proxy/CDN this would attribute every client to the proxy's address —
    # configure the real_ip module (set_real_ip_from <trusted CIDRs> +
    # real_ip_header X-Forwarded-For + real_ip_recursive on) BEFORE adding
    # another proxy tier, or all clients share one rate bucket.
    limit_req_zone $binary_remote_addr zone=rl_auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=rl_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=rl_sse:10m rate=2r/s;

    # Rejected (over-limit) requests return 429 instead of the nginx default
    # 503 (applies to every limit_req in all servers/locations).
    limit_req_status 429;

    # Upstream definitions
    upstream api {
        server api:8000;
    }

    # Development only — used when nginx proxies to Vite dev server
    # In production, frontend is served as static files via volume
    upstream frontend_dev {
        server frontend:80;
    }

    include /etc/nginx/conf.d/*.conf;
}
