# Production nginx configuration
# Serves frontend static files directly, proxies API and SSE to the backend
#
# === SSL Setup ===
# This file ships with HTTP-only (port 80) enabled.
# To enable HTTPS:
#   1. Place your SSL certificates at /etc/nginx/ssl/fullchain.pem and privkey.pem
#   2. Comment out the "HTTP (default) server" block below (port 80 with server_name _)
#   3. Uncomment the "HTTPS server" block (port 443)
#   4. Uncomment the "HTTP to HTTPS redirect" block (port 80 with your-domain.com)
#   5. Replace "your-domain.com" with your actual domain name in both blocks

# === HTTP (default) server - Active by default ===
# Comment out this entire block when enabling HTTPS
server {
    listen 80;
    server_name _;

    # --- API proxy ---
    location /api/ {
        # Production rate limiting (uncomment for production)
        # limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # --- Auth endpoints (stricter rate limiting) ---
    location /api/v1/auth/ {
        # Production rate limiting (uncomment for production)
        # limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- SSE stream (special configuration for Server-Sent Events) ---
    location /stream/ {
        # Production rate limiting (uncomment for production)
        # limit_req zone=sse_limit burst=3 nodelay;

        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # SSE critical settings: disable all buffering
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Tell upstream to not buffer SSE responses
        proxy_set_header X-Accel-Buffering no;

        # SSE CORS header (EventSource is simple GET, no preflight)
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Headers "Authorization" always;
    }

    # --- Health check endpoint ---
    location /api/v1/health {
        proxy_pass http://api;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Frontend static files ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- Static assets caching ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Security headers ---
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # CSP header
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; connect-src 'self'" always;
}

